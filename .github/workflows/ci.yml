name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-static:
    name: Rust 格式化与 Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::result_large_err -A clippy::mixed_attributes_style

  rust-unit:
    name: Rust 单元测试（无数据库）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib --bins

  postgres-integration:
    name: PostgreSQL 集成测试（真实迁移）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p master-server --tests -- --nocapture 2>&1 | tee /tmp/pg-tests.log
      - name: 校验数据库测试二进制真实执行了用例
        run: |
          grep -qE "running [0-9]+ test" /tmp/pg-tests.log || { echo "没有运行任何集成测试用例" >&2; exit 1; }

  frontend:
    name: 前端测试与构建（admin-web）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: admin-web
      - run: pnpm test
        working-directory: admin-web
      - run: pnpm run build
        working-directory: admin-web

  dependency-audit:
    name: 依赖安全审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 cargo-audit
        run: cargo install cargo-audit --locked
      - name: Rust 依赖审计
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0134
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin-web/pnpm-lock.yaml
      - name: npm 依赖审计（admin-web）
        run: pnpm audit --prod --audit-level=high
        working-directory: admin-web

  worker-platform:
    name: Worker 跨平台单元测试
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p worker-agent --lib

  docker-build:
    name: 生产镜像构建与静态资源冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建生产镜像
        run: docker build -f deploy/Dockerfile.master -t drission-master-smoke .
      - name: 冒烟：镜像内静态资源
        run: |
          docker create --name smoke drission-master-smoke
          docker cp smoke:/app/admin-web/dist/index.html /tmp/index.html
          if docker cp smoke:/app/admin-web/node_modules /tmp/nm >/dev/null 2>&1; then
            echo "镜像内存在 node_modules" >&2
            docker rm -f smoke
            exit 1
          fi
          echo "index.html 存在，且镜像内无 node_modules"
          docker rm -f smoke
