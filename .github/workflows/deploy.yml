name: Build and Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Worker 二进制由 release-worker.yml 在 v* tag 推送时自动构建并发布 GitHub Release。
# deploy.yml 只负责 Master Docker 镜像的构建与生产部署，二者相互独立。
# 推送新版本的完整步骤见 docs/部署与运维指南.md 第 10 节。

jobs:
  build-and-push:
    name: 构建并推送 Docker 镜像 (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 GitHub Packages (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cloud-platform-master
          tags: |
            type=raw,value=release-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.master
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 部署至生产服务器
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 触发服务器拉取与更新
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            APP_DIR="/data/cloud-platform/deploy"
            echo "==> 进入部署目录: ${APP_DIR}"
            cd "${APP_DIR}"

            echo "==> 部署前备份数据库..."
            umask 077
            RELEASE_DIR=/data/ruoyi/releases/20260911-integration
            cp .env "$RELEASE_DIR/backup/cloud-env-before-actions"
            docker exec drission-postgres pg_dump -U postgres -Fc drission_book > "$RELEASE_DIR/backup/cloud-before-actions.dump"

            echo "==> 拉取本次构建的 Master 镜像..."
            export MASTER_IMAGE="ghcr.io/jwjw000/cloud-platform-master:release-${{ github.run_id }}-${{ github.run_attempt }}"
            docker compose --env-file .env -f docker-compose.yml pull master

            echo "==> 仅更新 Master 服务..."
            docker compose --env-file .env -f docker-compose.yml up -d --no-deps master

            echo "==> 精确轮询 Master 就绪状态..."
            for attempt in $(seq 1 30); do
              status="$(docker inspect --format '{{.State.Health.Status}}' drission-master 2>/dev/null || true)"
              if [ "${status}" = "healthy" ]; then
                echo "Master 已就绪（第 ${attempt} 次检查）"
                if grep -q '^MASTER_IMAGE=' .env; then
                  sed -i "s|^MASTER_IMAGE=.*|MASTER_IMAGE=${MASTER_IMAGE}|" .env
                else
                  printf '\nMASTER_IMAGE=%s\n' "$MASTER_IMAGE" >> .env
                fi
                exit 0
              fi
              if [ "${status}" = "unhealthy" ]; then
                echo "Master 健康检查失败" >&2
                docker compose --env-file .env -f docker-compose.yml logs --tail=100 master >&2 || true
                exit 1
              fi
              sleep 10
            done
            echo "Master 在 300 秒内未达到 healthy" >&2
            docker compose --env-file .env -f docker-compose.yml ps master >&2 || true
            exit 1
