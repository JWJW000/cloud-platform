services:
  postgres:
    image: postgres:16-alpine
    container_name: drission-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?PostgreSQL密码必须在环境变量中提供}
      POSTGRES_DB: ${POSTGRES_DB:-drission_book}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Master 与 Caddy 之外的服务不得访问数据库：只暴露到 Docker 内网
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  master:
    image: ${MASTER_IMAGE:-ghcr.io/jwjw000/cloud-platform-master:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.master
    container_name: drission-master
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL必须在环境变量中提供}"
      MASTER_JWT_SECRET: "${MASTER_JWT_SECRET:?MASTER_JWT_SECRET必须在环境变量中提供}"
      MASTER_FIELD_KEY: "${MASTER_FIELD_KEY:?MASTER_FIELD_KEY必须在环境变量中提供}"
      MASTER_SITE_BASE: "${MASTER_SITE_BASE:-}"
      MASTER_REQUIRE_CLIENT_CERT: "${MASTER_REQUIRE_CLIENT_CERT:-1}"
      DRISSION_CATALOG_MANIFEST_ROOT: /app/catalog-manifests
      WEBSHARE_API_KEY: "${WEBSHARE_API_KEY:-}"
      TZ: Asia/Shanghai
    volumes:
      # 卷由容器 root 初始化；Dockerfile 已确保 /app/data 属主为 appuser
      - master_data:/app/data
      # 可选的服务器书单目录：容器内严格只读，页面不能提交任意路径。
      - ${CATALOG_MANIFEST_HOST_PATH:-./manifests}:/app/catalog-manifests:ro
    ports:
      # 绑定宿主机本地端口供 Nginx 反向代理
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9443:9443"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  pgdata:
  master_data:
